name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # While the project is a scaffold (empty package.json, no lockfile) there is nothing to install.
      # The steps below start running as soon as a real package.json and pnpm-lock.yaml are committed.
      - name: Detect project readiness
        id: ready
        run: |
          if [ -s package.json ] && [ -f pnpm-lock.yaml ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping checks: package.json is empty or pnpm-lock.yaml is missing (scaffold phase)."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.ready.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.ready.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.ready.outputs.ready == 'true'
        run: pnpm run --if-present lint

      - name: Type check
        if: steps.ready.outputs.ready == 'true'
        run: pnpm run --if-present typecheck

      - name: Unit tests
        if: steps.ready.outputs.ready == 'true'
        run: pnpm run --if-present test

      - name: Build
        if: steps.ready.outputs.ready == 'true'
        run: pnpm run --if-present build
