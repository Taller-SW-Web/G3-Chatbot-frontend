name: CI

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
  schedule:
    # Full weekly run, including the real-stack E2E suite.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      full:
        description: "Run the full pipeline regardless of the diff"
        type: boolean
        default: true

# Least privilege: the workflow only reads the repository. The notify job
# elevates pull-requests/actions permissions for its own scope.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.scope.outputs.mode }}
      full: ${{ steps.scope.outputs.full }}
      modules: ${{ steps.scope.outputs.modules }}
      run_validate: ${{ steps.scope.outputs.run_validate }}
      run_unit: ${{ steps.scope.outputs.run_unit }}
      run_build: ${{ steps.scope.outputs.run_build }}
      run_security: ${{ steps.scope.outputs.run_security }}
      run_e2e: ${{ steps.scope.outputs.run_e2e }}
      run_sonar: ${{ steps.scope.outputs.run_sonar }}
      run_specs: ${{ steps.scope.outputs.run_specs }}
      run_dependency_review: ${{ steps.scope.outputs.run_dependency_review }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compute scope
        id: scope
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          INPUT_FULL: ${{ inputs.full }}
        run: |
          args=(--event "$EVENT_NAME")
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
            args+=(--base "origin/$BASE_REF")
          elif [ "$EVENT_NAME" = "push" ]; then
            args+=(--before "$BEFORE_SHA")
          else
            args+=(--full)
          fi
          if [ "$INPUT_FULL" = "true" ] || printf '%s' ",$LABELS," | grep -q ',ci:full,'; then
            args+=(--full)
          fi
          node scripts/ci/scope.mjs "${args[@]}" --github-output "$GITHUB_OUTPUT"

  # Lint + types + module boundaries in one job: one install, one report and
  # every error visible at once.
  validate:
    name: Validate
    needs: scope
    if: needs.scope.outputs.run_validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Descargar contrato del backend
        run: curl -fsS -o "$RUNNER_TEMP/openapi.json" https://raw.githubusercontent.com/Taller-SW-Web/G3-Chatbot-backend/development/docs/openapi.json
      - name: Run validators
        env:
          OPENAPI_PATH: ${{ runner.temp }}/openapi.json
        run: node scripts/ci/run-validators.mjs --report validation-report.txt
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: validation-report.txt
          retention-days: 90
          if-no-files-found: warn

  unit-tests:
    name: Unit tests
    needs: [scope, validate]
    if: |
      always() && needs.scope.outputs.run_unit == 'true' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests with coverage
        run: pnpm run test:coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: coverage/
          if-no-files-found: error

  build:
    name: Build
    needs: [scope, validate]
    if: |
      always() && needs.scope.outputs.run_build == 'true' &&
      needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm run build

  security:
    name: Dependency audit
    needs: scope
    if: needs.scope.outputs.run_security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

  # The most expensive job. It runs on development, the weekly schedule, or a
  # pull request labelled `ci:full`; not on every PR.
  e2e:
    name: E2E
    needs: [scope, validate, unit-tests]
    if: |
      always() && needs.scope.outputs.run_e2e == 'true' &&
      needs.validate.result == 'success' &&
      needs.unit-tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chatbot_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      E2E_BACKEND_REF: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chatbot_e2e
      API_PROXY_TARGET: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Clone backend
        run: git clone --depth 1 --branch "$E2E_BACKEND_REF" https://github.com/Taller-SW-Web/G3-Chatbot-backend.git ../backend
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: ../backend
        run: pip install -r requirements.txt
      - name: Migrate database
        working-directory: ../backend
        run: alembic upgrade head
      - name: Start backend (módulos fake)
        working-directory: ../backend
        env:
          MODULES_MODE: fake
          APP_ENV: development
          FRONTEND_BASE_URL: http://localhost:3000
        run: |
          nohup uvicorn src.infrastructure.main:app --host 127.0.0.1 --port 8000 > /tmp/backend.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 2
          done
          echo "::error::el backend no respondió en 120 s"
          cat /tmp/backend.log
          exit 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E
        run: pnpm exec playwright test
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    name: Dependency review
    needs: scope
    if: needs.scope.outputs.run_dependency_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Review dependencies
        uses: actions/dependency-review-action@v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  sonar:
    name: SonarCloud
    needs: [scope, validate, unit-tests]
    if: |
      always() && needs.scope.outputs.run_sonar == 'true' &&
      needs.validate.result == 'success' &&
      needs.unit-tests.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect SONAR_TOKEN
        id: token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Sin SONAR_TOKEN (PR de Dependabot o fork): se omite SonarCloud."
          fi
      - name: Download coverage
        if: steps.token.outputs.available == 'true'
        uses: actions/download-artifact@v8
        with:
          name: coverage-frontend
          path: coverage
      - name: SonarCloud scan
        if: steps.token.outputs.available == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
      - name: Enforce zero new issues (MINOR+)
        if: steps.token.outputs.available == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--pull-request "${{ github.event.pull_request.number }}")
          else
            args+=(--branch "${{ github.ref_name }}")
          fi
          node scripts/ci/sonar-gate-report.mjs \
            --project-key g3-chatbot-frontend "${args[@]}" \
            --fail-on-severity MINOR \
            --output sonar-strict-gate.md
      - name: Explain quality gate failure
        if: failure() && steps.token.outputs.available == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        run: |
          args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            args+=(--pull-request "${{ github.event.pull_request.number }}")
          else
            args+=(--branch "${{ github.ref_name }}")
          fi
          node scripts/ci/sonar-gate-report.mjs \
            --project-key g3-chatbot-frontend "${args[@]}" \
            --output sonar-gate-report.md
      - name: Upload Sonar gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sonar-gate-reports
          path: sonar-*.md
          if-no-files-found: ignore
          retention-days: 30

  specs:
    name: Specs del PR
    needs: scope
    if: needs.scope.outputs.run_specs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validar spec enlazada
        run: |
          git fetch --no-tags origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          git clone --depth 1 --branch development https://github.com/Taller-SW-Web/G3-Chatbot-specs.git specs-repo
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node scripts/check-specs.mjs --base "origin/${{ github.base_ref }}" --specs-repo specs-repo --body "$RUNNER_TEMP/pr-body.md"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}

  notify:
    name: Notify failure
    needs:
      - scope
      - validate
      - unit-tests
      - build
      - security
      - e2e
      - dependency-review
      - sonar
      - specs
    if: failure() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Comment the failure on the pull request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          SCOPE_REASON: ${{ needs.scope.outputs.reason }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/ci/notify-failure.mjs
      - name: Upload notification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-failure-report
          path: ci-failure.md
          if-no-files-found: ignore
          retention-days: 30

  # `check` is the required status check. It runs even when a job fails so a
  # skipped required check cannot count as passed, and it verifies that every
  # job the scope asked for actually succeeded.
  check:
    name: check
    needs:
      - scope
      - validate
      - unit-tests
      - build
      - security
      - e2e
      - dependency-review
      - sonar
      - specs
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every expected job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUN_VALIDATE: ${{ needs.scope.outputs.run_validate }}
          RUN_UNIT: ${{ needs.scope.outputs.run_unit }}
          RUN_BUILD: ${{ needs.scope.outputs.run_build }}
          RUN_SECURITY: ${{ needs.scope.outputs.run_security }}
          RUN_E2E: ${{ needs.scope.outputs.run_e2e }}
          RUN_SONAR: ${{ needs.scope.outputs.run_sonar }}
          RUN_SPECS: ${{ needs.scope.outputs.run_specs }}
          RUN_DEPENDENCY_REVIEW: ${{ needs.scope.outputs.run_dependency_review }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          failed = [
              name
              for name, payload in needs.items()
              if payload.get("result") in {"failure", "cancelled"}
          ]
          if failed:
              print("Failed jobs: " + ", ".join(sorted(failed)))
              sys.exit(1)

          expected = {
              "validate": os.environ.get("RUN_VALIDATE"),
              "unit-tests": os.environ.get("RUN_UNIT"),
              "build": os.environ.get("RUN_BUILD"),
              "security": os.environ.get("RUN_SECURITY"),
              "e2e": os.environ.get("RUN_E2E"),
              "sonar": os.environ.get("RUN_SONAR"),
              "specs": os.environ.get("RUN_SPECS"),
              "dependency-review": os.environ.get("RUN_DEPENDENCY_REVIEW"),
          }
          mismatched = [
              name
              for name, should_run in expected.items()
              if should_run == "true" and needs.get(name, {}).get("result") != "success"
          ]
          if mismatched:
              print("Jobs that should have run did not succeed: " + ", ".join(mismatched))
              sys.exit(1)
          print("All CI jobs passed or were intentionally skipped.")
          PY
